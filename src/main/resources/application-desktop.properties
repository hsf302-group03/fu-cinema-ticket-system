# ========================================================
# FU Cinema Desktop Configuration (Profile: desktop)
# ========================================================

# Tắt Web Server Tomcat để chạy độc lập không xung đột cổng 8080 với Website
spring.main.web-application-type=none

# Tắt DevTools restart classloader
spring.devtools.restart.enabled=false

# Tối ưu log SQL
spring.jpa.show-sql=false

# Kích hoạt Virtual Threads cho Java 21
spring.threads.virtual.enabled=true

spring.main.web-application-type=none
spring.devtools.restart.enabled=false
spring.jpa.show-sql=false
spring.threads.virtual.enabled=true
