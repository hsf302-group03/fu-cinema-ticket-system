<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Đổi mật khẩu')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4" style="max-width: 480px">
    <h3>Đổi mật khẩu</h3>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <form method="post" th:action="@{/customer/password}"
          th:object="${form}" novalidate class="mt-3">

        <div class="mb-3">
            <label class="form-label">Mật khẩu hiện tại <span class="text-danger">*</span></label>
            <input type="password" class="form-control"
                   th:field="*{currentPassword}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{currentPassword}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Mật khẩu mới <span class="text-danger">*</span></label>
            <input type="password" class="form-control"
                   th:field="*{newPassword}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{newPassword}"></div>
            <div class="form-text">Tối thiểu 8 ký tự, có chữ hoa, chữ thường và chữ số.</div>
        </div>

        <div class="mb-3">
            <label class="form-label">Nhập lại mật khẩu mới <span class="text-danger">*</span></label>
            <input type="password" class="form-control"
                   th:field="*{confirmPassword}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-primary">Đổi mật khẩu</button>
            <a class="btn btn-secondary" th:href="@{/customer/profile}">Huỷ</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
